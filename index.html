<style>

:root{--bg:#f8f7fa;--sidebar-bg:#f3f1f6;--card-bg:#ffffff;--text-primary:#3a3848;--text-secondary:#726e82;--text-muted:#b0acba;--border:#e6e3ed;--border-light:#f2f0f6;--accent:#9888c0;--accent-light:#f2eff9;--accent-hover:#7c6faa;--success:#8aafb8;--success-bg:#eef5f7;--warning:#e8986e;--warning-bg:#fdf2ec;--danger:#d47a7a;--danger-bg:#faeeee;--purple:#8ba8cc;--purple-bg:#eef4fb;--pink:#d4a0a8;--pink-bg:#f7eef1;--radius-sm:8px;--radius:12px;--radius-lg:16px;--shadow-sm:0 1px 2px rgba(0,0,0,0.03);--shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.02)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.sidebar{width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0 0;position:fixed;height:100vh;left:0;top:0;z-index:100;transition:transform 0.25s}
.sidebar-nav{flex:1;overflow-y:auto;padding:0 12px}
.sidebar-brand{padding:0 24px 28px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px;letter-spacing:-0.3px}
.sidebar-brand .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#6b7ec4,#9888c0);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.sidebar-nav{flex:1;padding:0 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin-bottom:2px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;font-size:14px;font-weight:500;color:var(--text-secondary);user-select:none}
.nav-item:hover{background:#ece8f2;color:var(--text-primary)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-tag{display:inline-flex;align-items:center;justify-content:center;padding:5px 16px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;letter-spacing:1px;opacity:0.88;transition:all 0.15s}
.nav-item.active .nav-tag{opacity:1;transform:scale(1.04)}
.nav-delete{margin-left:auto;opacity:0;font-size:13px;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px;transition:all 0.12s}
.nav-item:hover .nav-delete{opacity:1}
.nav-delete:hover{background:var(--danger-bg);color:var(--danger)}
.sidebar-footer{padding:10px 12px 12px;border-top:1px solid var(--border-light);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.btn-export{display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 0;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;color:var(--text-primary);transition:all 0.15s;border:1px solid var(--border);background:var(--sidebar-bg);font-family:inherit;width:100%}
.btn-export:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.add-module-btn{display:flex;align-items:center;justify-content:center;padding:8px 0;border-radius:var(--radius-sm);cursor:pointer;font-size:18px;font-weight:400;color:var(--accent);transition:all 0.12s;border:1px solid var(--border);background:var(--sidebar-bg);font-family:inherit;width:100%}
.add-module-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.main{margin-left:240px;flex:1;padding:36px 40px;max-width:calc(100vw - 240px);min-height:100vh}
.page{display:none}.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:24px;font-weight:700;letter-spacing:-0.4px}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.date-selector{display:flex;align-items:center;gap:6px;margin-bottom:24px}
.date-nav{padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);transition:all 0.12s;font-family:inherit}
.date-nav:hover{border-color:var(--accent);color:var(--accent)}
.date-today{font-size:15px;font-weight:600;padding:7px 16px;min-width:160px;text-align:center}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:all 0.15s}
.stat-card:hover{box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:500;letter-spacing:0.3px}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.stat-value.accent{color:var(--accent)}.stat-value.success{color:var(--success)}.stat-value.warning{color:var(--warning)}.stat-value.purple{color:var(--purple)}
.section-block{background:var(--card-bg);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:18px;position:relative}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;cursor:pointer}
.section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.section-toggle{font-size:11px;color:var(--text-muted);transition:transform 0.2s;padding:4px 8px;border-radius:4px}
.section-toggle:hover{background:#ece8f2}
.section-toggle.collapsed{transform:rotate(-90deg)}
.section-body{transition:all 0.2s}
.section-body.collapsed{display:none}
.task-list{display:flex;flex-direction:column;gap:5px}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f9f9f7;border-radius:var(--radius-sm);border:1px solid transparent;transition:all 0.12s}
.task-item:hover{border-color:var(--border);background:#fff;box-shadow:var(--shadow-sm)}
.task-item.completed .task-text{text-decoration:line-through;color:var(--text-muted)}
.task-checkbox{width:18px;height:18px;border:2px solid #d1d1d6;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all 0.12s}
.task-checkbox:hover{border-color:var(--accent)}
.task-checkbox.checked{background:var(--success);border-color:var(--success)}
.task-checkbox.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.task-text{flex:1;font-size:13px;line-height:1.4}
.task-source{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--purple-bg);color:var(--purple);font-weight:500;flex-shrink:0}
.task-date-tag{font-size:10px;padding:1px 6px;border-radius:10px;background:#f0f0f2;color:var(--text-muted);font-weight:500;flex-shrink:0}
.task-delete{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-muted);cursor:pointer;opacity:0;transition:all 0.12s;font-size:14px}
.task-item:hover .task-delete{opacity:1}
.task-delete:hover{background:var(--danger-bg);color:var(--danger)}
.add-task{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 12px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.12s;color:var(--text-muted);font-size:13px}
.add-task:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.add-task-input{display:none;gap:6px;margin-top:8px;align-items:center}
.add-task-input.active{display:flex}
.add-task-input input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit}
.add-task-input input:focus{border-color:var(--accent)}
.btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.12s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:#f0f0f0;color:var(--text-primary)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 7px;font-size:11px}
.btn-voice{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.12s;flex-shrink:0}
.btn-voice:hover{border-color:var(--accent);color:var(--accent)}
.btn-voice.recording{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.4)}50%{box-shadow:0 0 0 8px rgba(255,59,48,0)}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:500;color:var(--text-secondary)}
.form-input,.form-select,.form-textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit;background:#fff;transition:border-color 0.12s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:60px;line-height:1.5}
.duration-pills{display:flex;gap:6px}
.duration-pill{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;font-weight:500}
.duration-pill:hover{border-color:var(--accent);color:var(--accent)}
.duration-pill.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600}
.custom-duration{display:none;align-items:center;gap:6px;margin-top:6px}
.custom-duration.show{display:flex}.custom-duration input{width:70px}
.time-checkboxes{display:flex;gap:8px;flex-wrap:wrap}
.time-cb{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;user-select:none}
.time-cb:hover{border-color:var(--accent)}
.time-cb.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600}
.sport-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sport-list,.social-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sport-card,.social-card{background:#f9f9f7;border-radius:var(--radius);padding:16px;border:1px solid var(--border);transition:all 0.15s;position:relative}
.sport-card:hover,.social-card:hover{box-shadow:var(--shadow-sm);background:#fff}
.sport-card-header,.social-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sport-type-tag,.social-time-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.sport-type-tag.舞蹈{background:var(--pink-bg);color:var(--pink)}
.sport-type-tag.瑜伽{background:var(--purple-bg);color:var(--purple)}
.sport-type-tag.其他{background:var(--warning-bg);color:var(--warning)}
.social-time-tag{background:var(--accent-light);color:var(--accent)}
.sport-date,.social-date{font-size:11px;color:var(--text-muted)}
.sport-card-body,.social-card-body{display:flex;flex-direction:column;gap:6px}
.sport-stat,.social-stat{display:flex;justify-content:space-between;font-size:12px}
.sport-stat-label,.social-stat-label{color:var(--text-secondary)}
.sport-stat-value,.social-stat-value{font-weight:500}
.card-delete{position:absolute;top:10px;right:10px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-muted);cursor:pointer;opacity:0;transition:all 0.12s;font-size:13px}
.sport-card:hover .card-delete,.social-card:hover .card-delete,.inspiration-card:hover .card-delete{opacity:1}
.card-delete:hover{background:var(--danger-bg);color:var(--danger)}
.script-list{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto}
.script-item{padding:10px 12px;background:#f9f9f7;border-radius:var(--radius-sm);border:1px solid transparent;transition:all 0.12s}
.script-item:hover{border-color:var(--border);background:#fff;box-shadow:var(--shadow-sm)}
.script-item-header{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.script-item-title{font-size:13px;font-weight:600;flex:1}
.script-item-category{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--accent-light);color:var(--accent);white-space:nowrap}
.script-item-content{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:6px;white-space:pre-wrap}
.script-item-footer{display:flex;align-items:center;justify-content:space-between}
.script-copy-btn{padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-secondary);transition:all 0.12s}
.script-copy-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.script-copy-btn.copied{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.script-delete-btn{font-size:11px;color:var(--text-muted);cursor:pointer;transition:color 0.12s}
.script-delete-btn:hover{color:var(--danger)}
.script-toolbar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.script-search{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;outline:none;font-family:inherit}
.script-search:focus{border-color:var(--accent)}
.bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.book-card{background:var(--card-bg);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all 0.15s;position:relative}
.book-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.book-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.book-cover{width:100%;height:100px;border-radius:var(--radius-sm);margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.book-cover.c1{background:linear-gradient(135deg,#e8e7f7,#dcdaf5)}.book-cover.c2{background:linear-gradient(135deg,#e0f0e8,#c8e6d4)}.book-cover.c3{background:linear-gradient(135deg,#f7e8ef,#f0d4e2)}.book-cover.c4{background:linear-gradient(135deg,#f7f2e0,#f5ebc8)}.book-cover.c5{background:linear-gradient(135deg,#ede8f7,#dcd4f0)}
.book-title{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-author{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.book-note-count{font-size:10px;color:var(--accent);font-weight:500}
.book-delete{position:absolute;top:8px;right:8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-muted);cursor:pointer;opacity:0;transition:all 0.12s;font-size:12px;background:rgba(255,255,255,0.9)}
.book-card:hover .book-delete{opacity:1}
.book-delete:hover{background:var(--danger-bg);color:var(--danger)}
.add-book-card{background:var(--card-bg);border-radius:var(--radius);padding:18px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;min-height:170px;color:var(--text-muted)}
.add-book-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.add-book-card .plus{font-size:28px;margin-bottom:6px}.add-book-card .label{font-size:12px}
.notes-section{background:var(--card-bg);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.notes-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.notes-section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.notes-list{display:flex;flex-direction:column;gap:6px}
.note-item{padding:12px 14px;background:#f9f9f7;border-radius:var(--radius-sm);border:1px solid var(--border)}
.note-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.note-page{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--purple-bg);color:var(--purple)}
.note-date{font-size:11px;color:var(--text-muted)}
.note-content{font-size:13px;line-height:1.5;color:var(--text-primary);margin-bottom:6px}
.note-delete{font-size:11px;color:var(--text-muted);cursor:pointer;transition:color 0.12s}
.note-delete:hover{color:var(--danger)}
.inspiration-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.inspiration-card{background:var(--card-bg);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:all 0.15s;position:relative}
.inspiration-card:hover{box-shadow:var(--shadow)}
.inspiration-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.inspiration-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent)}
.inspiration-date{font-size:11px;color:var(--text-muted)}
.inspiration-content{font-size:13px;line-height:1.5;color:var(--text-primary)}
.data-table{width:100%;border-collapse:collapse}
.data-table th,.data-table td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--border)}
.data-table th{font-weight:600;color:var(--text-secondary);font-size:11px}
.data-table td input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;outline:none;font-family:inherit;background:transparent}
.data-table td input:focus{border-color:var(--accent);background:#fff}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.review-section{background:var(--card-bg);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.review-section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.review-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit;resize:vertical;min-height:100px;line-height:1.5}
.review-textarea:focus{border-color:var(--accent)}
.review-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review-stat-item{background:#f9f9f7;border-radius:var(--radius-sm);padding:14px;text-align:center}
.review-stat-num{font-size:26px;font-weight:700;margin-bottom:3px}
.review-stat-label{font-size:11px;color:var(--text-muted)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:#fff;border-radius:var(--radius-lg);width:90%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.15);max-height:90vh;display:flex;flex-direction:column}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0;flex-shrink:0}
.modal-title{font-size:17px;font-weight:700}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-muted);padding:4px;line-height:1}
.modal-body{flex:1;overflow-y:auto;padding:14px 24px;display:flex;flex-direction:column;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 22px;flex-shrink:0;border-top:1px solid var(--border-light)}
.empty-state{text-align:center;padding:40px 16px;color:var(--text-muted)}
.empty-state-icon{font-size:36px;margin-bottom:10px}
.empty-state-text{font-size:13px}
.add-sub-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.12s;color:var(--text-muted);font-size:12px;margin-top:14px;justify-content:center}
.add-sub-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.voice-row{display:flex;align-items:flex-start;gap:6px}
.voice-row textarea,.voice-row input{flex:1}
@media(max-width:1100px){.review-grid{grid-template-columns:1fr}.bookshelf{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media(max-width:768px){.sidebar{width:56px;padding:12px 0}.sidebar-brand{padding:0 8px 16px;justify-content:center}.sidebar-brand span{display:none}.sidebar-brand .logo-icon{width:30px;height:30px;font-size:13px}.nav-item{justify-content:center;padding:10px 8px;font-size:0;gap:0}.nav-item .nav-icon{font-size:18px}.nav-item .nav-delete{display:none}.sidebar-nav{padding:0 4px}.sidebar-footer{padding:4px;flex-shrink:0}.btn-export{font-size:11px;justify-content:center;padding:8px 2px;border-radius:4px}.add-module-btn{font-size:16px;justify-content:center;padding:8px 2px;border-radius:4px}.main{margin-left:56px;max-width:calc(100vw - 56px);padding:16px}.stats-bar{grid-template-columns:1fr 1fr}.sport-stats{grid-template-columns:1fr 1fr}.review-grid{grid-template-columns:1fr}.bookshelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.board{grid-template-columns:1fr}}

</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo-icon">齐</div>
    <span>我的工作台</span>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <button class="btn-export" onclick="exportData()">导出</button>
    <button class="btn-export" onclick="document.getElementById('import-file').click()">导入</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</aside>

<!-- 主内容区 -->
<main class="main" id="main-content">
  <!-- 待办页面 -->
  <div class="page active" id="page-todo">
    <div class="page-header">
      <div>
        <div class="page-title">待办事项</div>
        <div class="page-subtitle" id="todo-date-label"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="startAddTask()">+ 添加任务</button>
      </div>
    </div>
    <div class="date-selector">
      <button class="date-nav" onclick="changeDate(-1)">◀</button>
      <div class="date-today" id="date-display"></div>
      <button class="date-nav" onclick="changeDate(1)">▶</button>
      <button class="date-nav" onclick="goToday()" style="margin-left:8px;">今天</button>
    </div>
    <div class="stats-bar" id="todo-stats"></div>
    <div id="task-add-area" style="display:none;margin-bottom:16px;">
      <div class="section-block">
        <div style="display:flex;gap:8px;">
          <input type="text" class="form-input" id="task-input-text" placeholder="输入新任务...（可语音输入）" style="flex:1;">
          <button class="btn-voice" id="voice-task-input" onclick="startVoice('task-input-text','voice-task-input')">🎤</button>
          <button class="btn btn-primary" onclick="showTaskModal()">添加</button>
          <button class="btn btn-ghost" onclick="cancelAddTask()">取消</button>
        </div>
      </div>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- 工作页面 -->
  <div class="page" id="page-work">
    <div class="page-header">
      <div>
        <div class="page-title">工作</div>
        <div class="page-subtitle">选题灵感 · 笔记草稿 · 客服话术 · 每日数据 · 每周复盘</div>
      </div>
    </div>
    <div id="work-content"></div>
  </div>

  <!-- 日常页面 -->
  <div class="page" id="page-daily">
    <div class="page-header">
      <div>
        <div class="page-title">日常</div>
        <div class="page-subtitle">运动记录 · 社交时间 · 读书笔记</div>
      </div>
    </div>
    <div id="daily-content"></div>
  </div>
</main>

<!-- 模态框 -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;"></div>

<script>
// ===== 常量与配置 =====
const STORAGE_KEY = 'my_workbench_v4';
const DEFAULT_MODULES = [{"id": "todo", "name": "待办", "icon": "✅", "deletable": false}, {"id": "work", "name": "工作", "icon": "📋", "deletable": false}, {"id": "daily", "name": "日常", "icon": "🌿", "deletable": false}];

// ===== 工具函数 =====
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDate(ds) {
  const parts = ds.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

function getWeekday(ds) {
  const d = new Date(ds);
  return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
}

function getWeekStart(offset) {
  const now = new Date();
  now.setDate(now.getDate() - now.getDay() + offset * 7);
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function getWeekEnd(ws) {
  const d = new Date(ws);
  d.setDate(d.getDate() + 6);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ===== 数据层 =====
function loadDB() {
  const raw = localStorage.getItem(STORAGE_KEY);
  let db;
  if (raw) {
    try { db = JSON.parse(raw); } catch (e) { db = null; }
  }
  // 尝试从旧key迁移数据
  if (!db) {
    const oldKeys = ['my_workbench_v3', 'wb_v4'];
    for (const ok of oldKeys) {
      const oldRaw = localStorage.getItem(ok);
      if (oldRaw) {
        try { db = JSON.parse(oldRaw); if (db) break; } catch (e) {}
      }
    }
  }
  if (!db) {
    return {
      modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)),
      subModules: JSON.parse(JSON.stringify(DEFAULT_SUB_MODULES)),
      tasks: [],
      sports: [],
      socials: [],
      scripts: JSON.parse(JSON.stringify(PRESET_SCRIPTS)),
      books: [],
      inspirations: [],
      drafts: [],
      reviews: {},
      reviewStats: JSON.parse(JSON.stringify(DEFAULT_REVIEW_STATS)),
      dataFields: JSON.parse(JSON.stringify(DEFAULT_DATA_FIELDS)),
      dataRecords: {}
    };
  }
  // 同步图标：用默认配置更新已有模块的图标
  for (const m of db.modules) {
    const def = DEFAULT_MODULES.find(function(d) { return d.id === m.id; });
    if (def) { m.icon = def.icon; m.name = def.name; }
  }
  return db;
}

let DB = loadDB();
let nid = Math.max(0, ...DB.tasks.map(t => t.id || 0), ...DB.scripts.map(s => s.id || 0)) + 1;

// 清理非默认模块（用户之前手动添加的）
const defaultIds = DEFAULT_MODULES.map(function(d) { return d.id; });
DB.modules = DB.modules.filter(function(m) { return defaultIds.includes(m.id); });
for (const k of Object.keys(DB.subModules || {})) {
  if (!defaultIds.includes(k)) delete DB.subModules[k];
}
// 清理用户手动添加的子模块，只保留默认的
for (const modId of Object.keys(DB.subModules)) {
  const defaultSubs = DEFAULT_SUB_MODULES[modId] || [];
  const defaultSubIds = defaultSubs.map(function(s) { return s.id; });
  DB.subModules[modId] = (DB.subModules[modId] || []).filter(function(s) { return defaultSubIds.includes(s.id); });
}

// 确保子模块存在（按默认顺序补上缺失的默认子模块）
for (const m of DB.modules) {
  if (!DB.subModules[m.id]) {
    DB.subModules[m.id] = [];
  }
  if (DEFAULT_SUB_MODULES[m.id]) {
    const existing = DB.subModules[m.id] || [];
    const existingIds = existing.map(function(s) { return s.id; });
    for (const defSub of DEFAULT_SUB_MODULES[m.id]) {
      if (!existingIds.includes(defSub.id)) {
        // 按默认顺序插入
        const insertIdx = DEFAULT_SUB_MODULES[m.id].indexOf(defSub);
        const targetIdx = Math.min(insertIdx, existing.length);
        existing.splice(targetIdx, 0, JSON.parse(JSON.stringify(defSub)));
      }
    }
    DB.subModules[m.id] = existing;
  }
}

// 同步子模块 title（改名迁移，如 客服话术库→客服话术）
for (const modId of Object.keys(DB.subModules)) {
  const defs = DEFAULT_SUB_MODULES[modId] || [];
  for (const sub of DB.subModules[modId]) {
    const def = defs.find(function(d) { return d.id === sub.id; });
    if (def && def.title !== sub.title) sub.title = def.title;
  }
}

// 确保数据结构完整
if (!DB.reviewStats) DB.reviewStats = JSON.parse(JSON.stringify(DEFAULT_REVIEW_STATS));
if (!DB.dataFields) DB.dataFields = JSON.parse(JSON.stringify(DEFAULT_DATA_FIELDS));
if (!DB.dataRecords) DB.dataRecords = {};
if (!DB.socials) DB.socials = [];
save();

function ensureDailyTasks(ds) {
  const existing = DB.tasks.filter(t => t.date === ds && t.autoDaily);
  const existingTexts = existing.map(t => t.text);

  const autoTasks = [
    { text: '英语练习', repeat: 'daily' },
    { text: '笔记发布', repeat: 'daily' },
    { text: '笔记数据优化', repeat: 'daily' },
    { text: '数据统计', repeat: 'daily' },
    { text: '好评回复', repeat: 'daily' }
  ];

  for (const at of autoTasks) {
    if (!existingTexts.includes(at.text)) {
      DB.tasks.push({
        id: nid++,
        text: at.text,
        date: ds,
        done: false,
        repeat: at.repeat,
        autoDaily: true
      });
    }
  }
  save();
}

];

var titleEndings = [
  '氛围感拉满', '越看越喜欢', '随手一拍就是大片', '美到失语',
  '真的yyds', '太治愈了', '好看到哭', '谁用谁知道',

  '一眼就爱了', '相见恨晚', '被夸爆了', '根本不想出门'
];

function generateTitle() {
  var f = titleFormulas[Math.floor(Math.random() * titleFormulas.length)];
  var s = titleSubjects[Math.floor(Math.random() * titleSubjects.length)];
  var e = titleEndings[Math.floor(Math.random() * titleEndings.length)];

  // 随机组合方式
  var r = Math.random();
  if (r < 0.25) {
    return f.prefix + s + (f.suffix ? f.suffix : '，' + e);
  } else if (r < 0.5) {
    return s + '｜' + e;
  } else if (r < 0.75) {
    return f.prefix + s + '，' + e;
  } else {
    return '分享我的' + s + '，' + e;
  }
}

  var el = document.getElementById('generated-title');

function showTaskModal() {
  const input = document.getElementById('task-input-text');
  const text = input.value.trim();
  if (!text) return;

  const weekdayOptions = ['日','一','二','三','四','五','六'].map(function(d, i) {
    return '<option value="' + i + '">周' + d + '</option>';
  }).join('');

  showModal('添加任务',
    '<div class="form-group"><label class="form-label">任务内容</label><input type="text" class="form-input" value="' + escAttr(text) + '" readonly></div>' +
    '<div class="form-group"><label class="form-label">重复频率</label><select class="form-select" id="task-repeat" onchange="document.getElementById(\'task-weekday-group\').style.display=this.value===\'weekly\'?\'flex\':\'none\';"><option value="once">仅此一次</option><option value="daily">每天</option><option value="weekly">每周</option></select></div>' +
    '<div class="form-group" id="task-weekday-group" style="display:none;"><label class="form-label">星期几</label><select class="form-select" id="task-weekday">' + weekdayOptions + '</select></div>',
    function() {
      const repeat = document.getElementById('task-repeat').value;
      const task = { id: nid++, text: text, date: currentDate, done: false };

      if (repeat === 'daily') {
        task.repeat = 'daily';
        task.autoDaily = true;
      } else if (repeat === 'weekly') {
        task.repeat = 'weekly';
        task.weekday = parseInt(document.getElementById('task-weekday').value);
      }

      DB.tasks.unshift(task);
      save(); closeModal();
      document.getElementById('task-input-text').value = '';
      renderTasks(); cancelAddTask();
    }
  );
}

function toggleTask(id, done) {
  const t = DB.tasks.find(t => t.id === id);
  if (t) { t.done = done; save(); renderTasks(); }
}

function deleteTask(id) {
  DB.tasks = DB.tasks.filter(t => t.id !== id);
  save(); renderTasks();
}

function editTask(id) {
  const t = DB.tasks.find(t => t.id === id);
  if (!t) return;
  const weekdayOptions = ['日','一','二','三','四','五','六'].map(function(d, i) {
    return '<option value="' + i + '"' + (t.weekday === i ? ' selected' : '') + '>周' + d + '</option>';
  }).join('');

  showModal('编辑任务',
    '<div class="form-group"><label class="form-label">任务内容</label><input type="text" class="form-input" id="edit-task-text" value="' + escAttr(t.text) + '"></div>' +
    '<div class="form-group"><label class="form-label">重复频率</label><select class="form-select" id="edit-task-repeat" onchange="document.getElementById(\'edit-task-weekday-group\').style.display=this.value===\'weekly\'?\'flex\':\'none\';"><option value="once"' + (!t.repeat ? ' selected' : '') + '>仅此一次</option><option value="daily"' + (t.repeat === 'daily' ? ' selected' : '') + '>每天</option><option value="weekly"' + (t.repeat === 'weekly' ? ' selected' : '') + '>每周</option></select></div>' +
    '<div class="form-group" id="edit-task-weekday-group" style="display:' + (t.repeat === 'weekly' ? 'flex' : 'none') + ';"><label class="form-label">星期几</label><select class="form-select" id="edit-task-weekday">' + weekdayOptions + '</select></div>',
    function() {
      t.text = document.getElementById('edit-task-text').value.trim();
      if (!t.text) { alert('任务内容不能为空'); return; }
      const repeat = document.getElementById('edit-task-repeat').value;
      if (repeat === 'daily') { t.repeat = 'daily'; t.autoDaily = true; delete t.weekday; }
      else if (repeat === 'weekly') { t.repeat = 'weekly'; t.weekday = parseInt(document.getElementById('edit-task-weekday').value); delete t.autoDaily; }
      else { delete t.repeat; delete t.autoDaily; delete t.weekday; }
      save(); closeModal(); renderTasks();
    }
  );
}

function changeDate(delta) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  currentDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  ensureDailyTasks(currentDate);
  renderTasks();
}

function goToday() {
  currentDate = todayStr();
  ensureDailyTasks(currentDate);
  renderTasks();
}

function showInspirationModal(editId) {
  const inspTags = DB.inspTags || ['内容选题','视频创意','生活灵感','学习心得','其他'];
  const tagOptions = inspTags.map(function(t) { return '<option>' + esc(t) + '</option>'; }).join('');

  let editItem = null;
  let title = '添加灵感';
  if (editId) {
    editItem = (DB.inspirations || []).find(function(i) { return i.id === editId; });
    if (editItem) title = '编辑灵感';
  }

  const defaultTag = editItem ? esc(editItem.tag || inspTags[0]) : inspTags[0];
  const defaultContent = editItem ? esc(editItem.content || '') : '';
  const defaultImage = editItem ? esc(editItem.image || '') : '';

  showModal(title,
    '<div class="form-group"><label class="form-label">标签</label><select class="form-select" id="insp-tag">' + tagOptions + '</select></div>' +
    '<div class="form-group"><label class="form-label">灵感内容</label><div class="voice-row"><textarea class="form-textarea" id="insp-content" placeholder="写下你的灵感片段...（可语音输入）" style="min-height:120px;">' + defaultContent + '</textarea><button class="btn-voice" id="voice-insp-content" onclick="startVoice(\'insp-content\',\'voice-insp-content\')">🎤</button></div></div>' +
    '<div class="form-group"><label class="form-label">图片（选填）</label>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
    '<input type="text" class="form-input" id="insp-image" placeholder="粘贴图片URL..." style="flex:1;min-width:150px;" value="' + defaultImage + '">' +
    '<span style="color:var(--text-muted);font-size:12px;">或</span>' +
    '<label class="btn btn-ghost" style="cursor:pointer;border:1px solid var(--border);padding:8px 14px;font-size:13px;margin:0;">📷 本地上传<input type="file" accept="image/*" id="insp-img-upload" style="display:none;" onchange="handleInspImgUpload(this)"></label>' +
    '</div>' +
    '<div id="insp-img-preview" style="margin-top:8px;' + (defaultImage ? '' : 'display:none;') + '"><img id="insp-img-preview-img" style="max-width:100%;max-height:150px;border-radius:8px;"' + (defaultImage ? ' src="' + defaultImage + '"' : '') + '></div></div>',
    function() {
      const tag = document.getElementById('insp-tag').value;
      const content = document.getElementById('insp-content').value.trim();
      if (!DB.inspirations) DB.inspirations = [];

      let image = null;
      const uploadData = document.getElementById('insp-img-upload')._imgData;
      if (uploadData) {
        image = uploadData;
      } else {
        const url = document.getElementById('insp-image').value.trim();
        if (url) image = url;
      }

      if (!content && !image) { alert('请至少输入文字或上传图片'); return; }

      if (editItem) {
        editItem.tag = tag;
        editItem.content = content;
        editItem.image = image;
      } else {
        DB.inspirations.unshift({
          id: genId(),
          tag: tag,
          content: content,
          image: image,
          date: todayStr()
        });
      }
      save(); closeModal(); renderPage();
    }
  );

  // 设置默认选中标签
  setTimeout(function() {
    const sel = document.getElementById('insp-tag');
    if (sel && defaultTag) {
      for (const opt of sel.options) {
        if (opt.value === defaultTag) { sel.value = defaultTag; break; }
      }
    }
  }, 50);
}

function handleInspImgUpload(input) {
  const file = input.files[0];
  if (!file) return;
  compressImage(file, 800, 0.6, function(dataUrl) {
    input._imgData = dataUrl;
    const preview = document.getElementById('insp-img-preview');
    const img = document.getElementById('insp-img-preview-img');
    if (preview && img) {
      img.src = dataUrl;
      preview.style.display = 'block';
    }
  });
}

  }
  return html;
}

function copyTextById(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const text = el.value;
  navigator.clipboard.writeText(text).then(function() {
    showToast('已复制');
  }).catch(function() {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制');
  });
}

    if (preview && img) { img.src = dataUrl; preview.style.display = 'block'; }

// 通用图片压缩函数
function compressImage(file, maxW, quality, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxW) { w = w * maxW / h; h = maxW; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 话术拖拽排序（仅在调序模式下生效，长按触发）
function enableScriptDragSort(container) {
  const items = container.querySelectorAll('.script-item');
  let longPressTimer = null;
  let dragItem = null;

  items.forEach(function(item) {
    let isDragging = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let itemOffsetY = 0;

    item.addEventListener('pointerdown', function(e) {
      if (!scriptSortMode) return;
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      isDragging = false;
      longPressTimer = setTimeout(function() {
        isDragging = true;
        dragItem = item;
        item.style.opacity = '0.5';
        const rect = item.getBoundingClientRect();
        itemOffsetY = e.clientY - rect.top;
        item.style.position = 'fixed';
        item.style.left = rect.left + 'px';
        item.style.top = rect.top + 'px';
        item.style.width = rect.width + 'px';
        item.style.zIndex = '100';
        item.style.pointerEvents = 'none';
      }, 400);
    });

    item.addEventListener('pointermove', function(e) {
      if (!dragItem || dragItem !== item) return;
      if (!isDragging) {
        const dx = Math.abs(e.clientX - touchStartX);
        const dy = Math.abs(e.clientY - touchStartY);
        if (dx > 10 || dy > 10) {
          clearTimeout(longPressTimer);
          dragItem = null;
          return;
        }
      } else {
        item.style.top = (e.clientY - itemOffsetY) + 'px';
      }
    });

    item.addEventListener('pointerup', function(e) {
      clearTimeout(longPressTimer);
      if (!isDragging || !dragItem || dragItem !== item) {
        dragItem = null;
        isDragging = false;
        return;
      }

      item.style.opacity = '1';
      item.style.position = '';
      item.style.left = '';
      item.style.top = '';
      item.style.width = '';
      item.style.zIndex = '';
      item.style.pointerEvents = '';

      const allItems = container.querySelectorAll('.script-item');
      let targetId = null;
      allItems.forEach(function(other) {
        if (other === item) return;
        const r = other.getBoundingClientRect();
        if (e.clientY > r.top && e.clientY < r.bottom) {
          targetId = parseInt(other.dataset.scriptId);
        }
      });

      if (targetId !== null && targetId !== parseInt(item.dataset.scriptId)) {
        const scripts = DB.scripts;
        const srcIdx = scripts.findIndex(function(s) { return s.id === parseInt(item.dataset.scriptId); });
        const dstIdx = scripts.findIndex(function(s) { return s.id === targetId; });
        if (srcIdx >= 0 && dstIdx >= 0) {
          const moved = scripts.splice(srcIdx, 1)[0];
          scripts.splice(dstIdx, 0, moved);
          save();
          renderPage();
          // 重新展开当前组
          document.querySelectorAll('.script-group-body').forEach(function(body) {
            if (body.style.display !== 'none' && scriptSortMode) enableScriptDragSort(body);
          });
        }
      }

      dragItem = null;
      isDragging = false;
    });

    item.addEventListener('pointerleave', function() {
      clearTimeout(longPressTimer);
    });
  });
}

function showAddDataField() {
  const name = prompt('新字段名称：');
  if (!name || !name.trim()) return;
  if (DB.dataFields.includes(name.trim())) { alert('字段已存在'); return; }
  DB.dataFields.push(name.trim());
  save(); renderPage();
}

function deleteDataField(name) {
  if (!confirm('确定删除字段 "' + name + '"？这将删除所有记录中该字段的数据。')) return;
  DB.dataFields = DB.dataFields.filter(f => f !== name);
  for (const key in DB.dataRecords) {
    delete DB.dataRecords[key][name];
  }
  save(); renderPage();
}

function updateDataCell(field, value) {
  if (!DB.dataRecords[currentDate]) DB.dataRecords[currentDate] = {};
  DB.dataRecords[currentDate][field] = value;
  save();

  // 检查当天数据是否有任何字段被填写，有则自动勾选待办中的"数据统计"任务
  const record = DB.dataRecords[currentDate] || {};
  const hasData = Object.values(record).some(function(v) { return v && String(v).trim() !== '' && String(v).trim() !== '0'; });
  if (hasData) {
    const dataTasks = DB.tasks.filter(function(t) {
      return t.date === currentDate && !t.done && (t.text.includes('数据统计') || t.text.includes('数据填报') || t.text.includes('填写数据') || t.text.includes('每日数据'));
    });
    if (dataTasks.length > 0) {
      dataTasks.forEach(function(t) { t.done = true; });
      save();
      if (activeModule === 'todo') renderTasks();
    }
  }
}

function changeDataDate(delta) {

// ===== 每周复盘 =====
function renderReviewContent() {
  let html = '<div class="page-header"><div class="page-title">每周复盘</div><button class="btn btn-ghost" onclick="showReviewConfig()">⚙️ 配置统计卡片</button></div>';

  html += '<div class="date-selector">';
  html += '<button class="date-nav" onclick="changeWeek(-1)">◀</button>';
  html += '<div class="date-today" id="review-week-label"></div>';
  html += '<button class="date-nav" onclick="changeWeek(1)">▶</button>';
  html += '<button class="date-nav" onclick="currentWeekOffset=0;renderPage();" style="margin-left:8px;">本周</button>';
  html += '</div>';

  const ws = getWeekStart(currentWeekOffset);
  const we = getWeekEnd(ws);

  // 计算本周数据
  let totalSales = 0, totalRevenue = 0, totalReturns = 0, totalReturnAmount = 0;
  for (let d = new Date(ws); d <= new Date(we); d.setDate(d.getDate() + 1)) {
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const rec = DB.dataRecords[ds] || {};
    totalSales += parseFloat(rec['销售量']) || 0;
    totalRevenue += parseFloat(rec['销售额']) || 0;
    totalReturns += parseFloat(rec['退货量']) || 0;
    totalReturnAmount += parseFloat(rec['退货额']) || 0;
  }

  const netSales = totalSales - totalReturns;
  const netRevenue = totalRevenue - totalReturnAmount;
  const returnRate = totalSales > 0 ? Math.round(totalReturns / totalSales * 100) : 0;

  // 本周运动次数
  let sportInWeek = 0;
  for (let d = new Date(ws); d <= new Date(we); d.setDate(d.getDate() + 1)) {
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    sportInWeek += (DB.sports || []).filter(s => s.date === ds).length;
  }

  // 本周灵感条数
  let inspInWeek = 0;
  for (let d = new Date(ws); d <= new Date(we); d.setDate(d.getDate() + 1)) {
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    inspInWeek += (DB.inspirations || []).filter(i => i.date === ds).length;
  }

  const calcMap = {
    sales: netSales,
    revenue: netRevenue.toFixed(2),
    returns: totalReturns,
    returnRate: returnRate + '%',
    sportCount: sportInWeek,
    inspCount: inspInWeek
  };

  html += '<div class="stats-bar">';
  for (const s of DB.reviewStats) {
    const val = calcMap[s.calc] !== undefined ? calcMap[s.calc] : '-';
    html += '<div class="stat-card"><div class="stat-label">' + esc(s.label) + '</div><div class="stat-value ' + s.color + '">' + val + '</div></div>';
  }
  html += '</div>';

  document.getElementById('review-week-label') && (document.getElementById('review-week-label').textContent = ws + ' ~ ' + we);

  return html;
}

function changeWeek(delta) {
  currentWeekOffset += delta;
  renderPage();
}

// ===== 子模块拖拽排序 =====
let dragSrcSubId = null;
let dragDidDrop = false;

// 通用子模块拖拽排序（兼容桌面和移动端，长按触发）
function enableSubDragSort(container, modId) {
  const cards = container.querySelectorAll('.sub-card');
  let longPressTimer = null;
  let dragCard = null;
  let clone = null;
  let startY = 0;
  let startX = 0;
  let cardOffsetY = 0;
  let cardOffsetX = 0;

  cards.forEach(function(card) {
    // 长按开始拖拽
    card.addEventListener('pointerdown', function(e) {
      longPressTimer = setTimeout(function() {
        dragCard = card;
        dragDidDrop = false;
        card.style.opacity = '0.5';
        card.style.zIndex = '100';
        startY = e.clientY;
        startX = e.clientX;
        const rect = card.getBoundingClientRect();
        cardOffsetY = startY - rect.top;
        cardOffsetX = startX - rect.left;
        card.style.position = 'fixed';
        card.style.left = rect.left + 'px';
        card.style.top = rect.top + 'px';
        card.style.width = rect.width + 'px';
        card.style.pointerEvents = 'none';
      }, 400);
    });

    card.addEventListener('pointermove', function(e) {
      if (!dragCard || dragCard !== card) return;
      card.style.left = (e.clientX - cardOffsetX) + 'px';
      card.style.top = (e.clientY - cardOffsetY) + 'px';

      // 检测下方卡片
      const allCards = container.querySelectorAll('.sub-card');
      allCards.forEach(function(other) {
        if (other === card) return;
        const r = other.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (e.clientY > mid) {
          other.style.transform = 'translateY(0)';
        } else {
          other.style.transform = 'translateY(0)';
        }
      });
    });

    card.addEventListener('pointerup', function(e) {
      clearTimeout(longPressTimer);
      if (!dragCard || dragCard !== card) return;

      dragDidDrop = true;
      card.style.opacity = '1';
      card.style.zIndex = '';
      card.style.position = '';
      card.style.left = '';
      card.style.top = '';
      card.style.width = '';
      card.style.pointerEvents = '';

      // 找到目标位置
      const allCards = container.querySelectorAll('.sub-card');
      let targetId = null;
      allCards.forEach(function(other) {
        other.style.transform = '';
        if (other === card) return;
        const r = other.getBoundingClientRect();
        if (e.clientY > r.top && e.clientY < r.bottom) {
          targetId = other.dataset.subId;
        }
      });

      if (targetId && targetId !== card.dataset.subId) {
        const subs = DB.subModules[modId];
        const srcIdx = subs.findIndex(function(s) { return s.id === card.dataset.subId; });
        const dstIdx = subs.findIndex(function(s) { return s.id === targetId; });
        if (srcIdx >= 0 && dstIdx >= 0) {
          const moved = subs.splice(srcIdx, 1)[0];
          subs.splice(dstIdx, 0, moved);
          save();
          renderPage();
        }
      }

      dragCard = null;
    });

    card.addEventListener('pointerleave', function() {
      clearTimeout(longPressTimer);
    });
  });
}

      const title = document.getElementById('book-title').value.trim();
      const author = document.getElementById('book-author').value.trim();
      if (!title) { alert('请输入书名'); return; }
      if (!DB.books) DB.books = [];
      DB.books.push({ id: genId(), title, author, notes: [], expanded: true });
      save(); closeModal(); renderPage();
    }
  );
}

function showNoteModal(bookId) {
  const book = DB.books.find(b => b.id === bookId);
  if (!book) return;

  showModal('添加笔记 - ' + book.title,
    '<div class="form-group"><label class="form-label">页码</label><input type="number" class="form-input" id="note-page" placeholder="页码" min="1"></div>' +
    '<div class="form-group"><label class="form-label">笔记内容</label><textarea class="form-textarea" id="note-content" placeholder="写下你的想法..." style="min-height:120px;"></textarea></div>',
    function() {
      const page = parseInt(document.getElementById('note-page').value) || 0;
      const content = document.getElementById('note-content').value.trim();
      if (!content) { alert('请输入笔记内容'); return; }
      book.notes = book.notes || [];
      book.notes.push({ id: genId(), page, content, date: todayStr() });
      book.expanded = true;
      save(); closeModal(); renderPage();
    }
  );
}

function deleteBook(id) {
  if (!confirm('确定删除这本书及其所有笔记？')) return;
  DB.books = DB.books.filter(b => b.id !== id);
  save(); renderPage();
}

function deleteNote(bookId, noteId) {
  const book = DB.books.find(b => b.id === bookId);
  if (book) {
    book.notes = book.notes.filter(n => n.id !== noteId);
    save(); renderPage();
  }
}

// ===== 模态框 =====
function showModal(title, bodyHtml, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML =
    '<button class="btn btn-ghost" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="modal-confirm-btn">确定</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-confirm-btn').onclick = function() {
    if (onConfirm) onConfirm();
  };
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(function() { toast.style.opacity = '0'; }, 2000);
}

// ===== 语音录入 =====
function startVoice(inputId, btnId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('您的浏览器不支持语音识别，请使用Chrome浏览器'); return; }

  const recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;

  const btn = document.getElementById(btnId);
  if (btn) { btn.textContent = '🔴'; btn.style.animation = 'pulse 0.8s infinite'; }

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById(inputId);
    if (input) {
      if (input.tagName === 'TEXTAREA') {
        input.value = input.value ? input.value + '\n' + transcript : transcript;
      } else {
        input.value = transcript;
      }
    }
    showToast('语音识别完成');
  };

  recognition.onerror = function(event) {
    showToast('语音识别失败: ' + event.error);
  };

  recognition.onend = function() {
    if (btn) { btn.textContent = '🎤'; btn.style.animation = ''; }
  };

  recognition.start();
}

// ===== 导入导出 =====
function exportData() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workbench_backup_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.modules || !data.subModules) throw new Error('Invalid format');
      DB = data;
      nid = Math.max(0, ...DB.tasks.map(t => t.id || 0), ...DB.scripts.map(s => s.id || 0)) + 1;
      save();
      activeModule = DB.modules[0] ? DB.modules[0].id : 'todo';
      activeSubModule = null;
      renderNav(); renderPage();
      showToast('数据导入成功');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 初始化 =====
function init() {
  renderNav();
  renderPage();

  // 键盘快捷键
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // 点击模态框外部关闭
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
}

// 启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
